[package]
name = "validators"
version = "0.1.0"
edition = "2021"
description = "Generated JTD wire-event validators (jtd-codegen --target rust), compiled both as rlib (pure-Rust tests) and cdylib+wasm (browser)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
