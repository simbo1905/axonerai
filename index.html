<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Agent Chat</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 90vh; }
        .chat-window { flex: 1; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { align-self: flex-end; background-color: #007bff; color: white; }
        .assistant { align-self: flex-start; background-color: #e9ecef; color: black; }
        .input-area { display: flex; gap: 10px; }
        textarea { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #ddd; resize: none; }
        button { padding: 10px 20px; border: none; background-color: #007bff; color: white; border-radius: 4px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [connected, setConnected] = useState(false);
            const ws = useRef(null);
            const chatEndRef = useRef(null);

            useEffect(() => {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;
                ws.current = new WebSocket(wsUrl);

                ws.current.onopen = () => {
                    console.log("Connected to WebSocket");
                    setConnected(true);
                };

                ws.current.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'response') {
                        setMessages(prev => [...prev, { role: 'assistant', content: data.content }]);
                    } else if (data.type === 'error') {
                        setMessages(prev => [...prev, { role: 'assistant', content: `Error: ${data.content}` }]);
                    }
                };

                ws.current.onclose = () => {
                    setConnected(false);
                    console.log("Disconnected");
                };

                return () => {
                    if (ws.current) ws.current.close();
                };
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages]);

            const sendMessage = () => {
                if (!input.trim() || !connected) return;
                
                const userMsg = { role: 'user', content: input };
                setMessages(prev => [...prev, userMsg]);
                ws.current.send(JSON.stringify({ content: input }));
                setInput("");
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            return (
                <div className="container">
                    <h1>Agent Chat</h1>
                    <div className="chat-window">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`message ${msg.role}`}>
                                <strong>{msg.role === 'user' ? 'You' : 'Agent'}:</strong>
                                <div style={{whiteSpace: 'pre-wrap'}}>{msg.content}</div>
                            </div>
                        ))}
                        <div ref={chatEndRef} />
                    </div>
                    <div className="input-area">
                        <textarea 
                            value={input} 
                            onChange={(e) => setInput(e.target.value)} 
                            onKeyPress={handleKeyPress}
                            placeholder="Type a message..."
                            disabled={!connected}
                        />
                        <button onClick={sendMessage} disabled={!connected}>Send</button>
                    </div>
                    {!connected && <div style={{color: 'red', marginTop: '5px'}}>Disconnected from server</div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
