openapi: 3.1.0
info:
  title: axoner-web control plane
  description: >
    REST surface of the axoner-web server (example `axoner-web`). The
    interactive agent traffic runs over the `/ws` WebSocket; these endpoints
    are the control plane the UI panel renders: state snapshot, tool
    on/off toggles, session index and rollout catch-up streams.
  version: 0.1.1

servers:
  - url: http://127.0.0.1:8080
    description: Local server (the actual port is chosen at startup)

paths:
  /api/state:
    get:
      summary: Control-plane state snapshot
      description: >
        Snapshot of the running server: active provider/model, current
        session, repo info, approximate context size, tool registry with
        on/off state, and registered MCP servers. `mcp` lists each server
        with facade tools registered (i.e. its API key is set) and its
        current `enabled` toggle state (item48); `lsp` is a placeholder
        (always empty) and `todo` is a placeholder (always null). Context
        tokens are a bytes/4 estimate over the JSON serialization of the
        session's provider messages (the per-session agent-state file,
        system prompt included when loaded); WS protocol frames are
        excluded entirely.
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateSnapshot"

  /api/models:
    get:
      summary: Models config for the current provider
      description: >
        The per-provider models config (item41): model ids, display names,
        context windows, optional cost strings and freeform offers, loaded
        from `.axonerai/models/<provider>-models.jsonc` (local masks user,
        missing-safe). Pass `?reload=1` to re-read the config from disk
        first. With no config file for the provider, `source` is null and
        `models` is empty.
      parameters:
        - name: reload
          in: query
          required: false
          schema:
            type: boolean
          description: Re-read the models config from disk before responding
      responses:
        "200":
          description: Current provider's model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsConfig"

  /api/tools:
    post:
      summary: Enable or disable a tool
      description: >
        Toggles a registered tool's suppression state. Disabled tools are
        hidden from the model and error on execution. The state is persisted
        to `.axonerai/settings.jsonc` and survives server restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolToggle"
      responses:
        "200":
          description: Toggle applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required: [ok]
        "400":
          description: The tool name is not in the registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: false
                  error:
                    type: string
                    const: unknown tool
                required: [ok, error]

  /api/mcp:
    post:
      summary: Enable or disable an MCP server's tools
      description: >
        The panel-level MCP toggle (item48): applies per-tool suppression to
        every registered MCP tool of that server, so a disabled server's
        tools are hidden from the model for this session. NOT persisted
        server-side — the browser is the durable store (per-folder
        localStorage) and re-applies the stored disabled servers on boot; a
        server restart re-exposes all MCP tools until the browser
        reconnects. Unknown server (one with no registered facade tools) →
        400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToggle"
      responses:
        "200":
          description: Toggle applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required: [ok]
        "400":
          description: The server has no registered MCP tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: false
                  error:
                    type: string
                    const: unknown mcp server
                required: [ok, error]

  /api/model:
    post:
      summary: Swap the agent model
      description: >
        Validates the model id against the jsonc config roster for the
        CURRENT provider PLUS the per-provider models config list (item41:
        any model id known to either config is accepted) and swaps the model
        used for SUBSEQUENT agent runs in this server process (the process
        serves one session; the swap rebuilds the agent behind the shared
        runtime lock and is not persisted — a restart returns to the
        configured/default model). Responds with the updated state snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelSwap"
      responses:
        "200":
          description: Model swapped; updated snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateSnapshot"
        "400":
          description: Unknown model for the current provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: false
                  error:
                    type: string
                required: [ok, error]

  /api/sessions:
    get:
      summary: Session index
      description: All rollout sessions, newest first.
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"

  /api/session/{uuid}:
    get:
      summary: Rollout catch-up stream
      description: >
        Chunked line-format stream (`application/x-rollout-line`) of rollout
        events after `after` (epoch millis). Frames are
        `<ts>\0<type>\0<payload>\n`; oversized payloads are cut
        char-boundary-safe and detected by a failed strict JSON parse on the
        client. `tool_trace` records are never streamed. The scan halts
        cleanly at the first corrupt line.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Lowercase UUID v7 session id
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: Only stream events with ts strictly greater than this
      responses:
        "200":
          description: Line-format stream
          content:
            application/x-rollout-line:
              schema:
                type: string
        "400":
          description: Invalid session id
        "404":
          description: Session not found

  /api/session/{uuid}/tail:
    get:
      summary: Rollout frontier timestamp
      description: Last event timestamp of the rollout, for frontier checks.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Frontier timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  _ts:
                    type: integer
                    format: int64
                required: [_ts]
        "400":
          description: Invalid session id
        "404":
          description: Session not found

components:
  schemas:
    StateSnapshot:
      type: object
      properties:
        provider:
          type: string
          description: Active provider name (e.g. "mistral")
        model:
          type: string
          description: Active model id (e.g. "zai-glm-5-2")
        session:
          type: object
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
          required: [id, title]
        repo:
          type: object
          properties:
            path:
              type: string
              description: Absolute cwd of the server process
            branch:
              type: [string, "null"]
              description: >
                Current git branch parsed from .git/HEAD (no subprocess);
                short sha on detached HEAD; null when not a repo
          required: [path, branch]
        context:
          type: object
          properties:
            tokens:
              type: integer
              description: >-
                Model context estimate: bytes/4 (floor) over the JSON
                serialization of the session's provider messages (system
                prompt included when loaded), read from the per-session
                agent-state file (`agent-state/<uuid>/messages.json`);
                0 when that file is missing or unreadable
            context_window:
              type: integer
              description: >-
                Current model's context window in tokens from the
                per-provider models config (item41,
                `.axonerai/models/<provider>-models.jsonc`, local masks
                user). Omitted when the config does not know the model —
                the browser's hardcoded window map stays as the fallback.
          required: [tokens]
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolInfo"
        mcp:
          type: array
          items:
            $ref: "#/components/schemas/McpServer"
        lsp:
          type: array
          items: {}
          description: Placeholder — always empty
        todo:
          description: Placeholder — always null
      required:
        - provider
        - model
        - session
        - repo
        - context
        - tools
        - mcp
        - lsp
        - todo

    ToolInfo:
      type: object
      properties:
        name:
          type: string
          description: Tool name (e.g. "WebSearch", "tavily_search")
        enabled:
          type: boolean
          description: false when the tool is suppressed
        source:
          type: string
          enum: [builtin, mcp]
      required: [name, enabled, source]

    McpServer:
      type: object
      properties:
        name:
          type: string
          description: Server name (e.g. "tavily")
        status:
          type: string
          enum: [connected]
        enabled:
          type: boolean
          description: >-
            Whether the server's tools are currently exposed to the model
            (false when POST /api/mcp has suppressed them for this session)
      required: [name, status, enabled]

    ToolToggle:
      type: object
      properties:
        name:
          type: string
          description: Registered tool name
        enabled:
          type: boolean
          description: true to enable, false to disable (suppress)
      required: [name, enabled]

    McpToggle:
      type: object
      properties:
        server:
          type: string
          description: Registered MCP server name (e.g. "tavily")
        enabled:
          type: boolean
          description: true to expose the server's tools, false to suppress them
      required: [server, enabled]

    ModelSwap:
      type: object
      properties:
        model:
          type: string
          description: Model id from the current provider's config roster or models config
      required: [model]

    ModelsConfig:
      type: object
      description: One provider's models config (item41 JTD schema provider_models.jdt.json)
      properties:
        provider:
          type: string
        source:
          type: [string, "null"]
          enum: [local, user, null]
          description: Which file won (local masks user); null when no config exists
        models:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              display:
                type: string
              context_window:
                type: integer
                minimum: 0
              costs:
                type: [object, "null"]
                properties:
                  input_per_mtok:
                    type: string
                  output_per_mtok:
                    type: string
                additionalProperties: false
              offer:
                type: string
                description: Freeform offer text (e.g. "2x usage")
            required: [id, display, context_window]
      required: [provider, source, models]

    SessionInfo:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
        updated:
          type: integer
          format: int64
          description: Last-update epoch millis
        size:
          type: integer
          format: int64
          description: Rollout file size in bytes
      required: [uuid, title, updated, size]
