openapi: 3.1.0
info:
  title: axoner-web control plane
  description: >
    REST surface of the axoner-web server (example `axoner-web`). The
    interactive agent traffic runs over the `/ws` WebSocket; these endpoints
    are the control plane the UI panel renders: state snapshot, tool
    on/off toggles, session index and rollout catch-up streams.
  version: 0.2.0

servers:
  - url: http://127.0.0.1:8080
    description: Local server (the actual port is chosen at startup)

paths:
  /api/state:
    get:
      summary: Control-plane state snapshot
      description: >
        Snapshot of the running server: active service/model, current
        session, repo info, approximate context size, tool registry with
        on/off state, and registered MCP servers. item57 renamed the
        `provider` field to `service` (the services model — a service is
        an endpoint + an API key; the field carries the service short
        name). `mcp` lists each server with facade tools registered (i.e.
        its API key is set) and its current `enabled` toggle state
        (item48); `lsp` is a placeholder (always empty) and `todo` is a
        placeholder (always null). Context tokens are a bytes/4 estimate
        over the JSON serialization of the session's provider messages
        (the per-session agent-state file, system prompt included when
        loaded); WS protocol frames are excluded entirely.
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateSnapshot"

  /api/services:
    get:
      summary: Services registry
      description: >
        item57: one entry per known service (`mistral`, `groq`,
        `opencode-zen`, `opencode-go`). A service = an endpoint + an API
        key. `enabled` is false when the service is named in the settings
        `disabled_services` list (someone with a shared key must not
        activate a service nobody is subscribed to); `connected` is true
        when its API key resolves (per-service env var, with the shared
        OPENCODE_API_KEY fallback for zen/go); `models` is the service's
        models-config roster (empty array when no config file). The list
        is recomputed on every request (settings + key lookup re-read —
        this IS the reload path). N services = enabled AND connected.
      responses:
        "200":
          description: One entry per known service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceEntry"

  /api/models:
    get:
      summary: Models config for the current provider
      description: >
        The per-provider models config (item41): model ids, display names,
        context windows, optional cost strings and freeform offers, loaded
        from `.axonerai/models/<provider>-models.jsonc` (local masks user,
        missing-safe). Pass `?reload=1` to re-read the config from disk
        first. With no config file for the provider, `source` is null and
        `models` is empty.
      parameters:
        - name: reload
          in: query
          required: false
          schema:
            type: boolean
          description: Re-read the models config from disk before responding
      responses:
        "200":
          description: Current provider's model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsConfig"

  /api/skills:
    get:
      summary: Skills listing
      description: >
        Every skill discoverable on the server (item49 + item50): one entry
        per `<name>/SKILL.md` under `.axonerai/skills` (repo-local) and
        `~/.axonerai/skills` (user fallback), plus the built-in skills shipped
        in the binary. LOCAL MASKS USER MASKS BUILTIN — a name that exists at
        a higher-precedence source is listed once, sourced from the winner.
        Missing-safe: a missing dir contributes nothing; an unreadable or
        unparsable SKILL.md is skipped (with a server-side stderr note),
        never an error. Sorted by name. item54: built-ins named in the
        settings `disabled_skills` list are dropped from the listing
        (builtin source ONLY — local/user folder skills of the same name
        are unaffected).
      responses:
        "200":
          description: Skill entries, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillEntry"

  /api/tools:
    post:
      summary: Enable or disable a tool
      description: >
        Toggles a registered tool's suppression state. Disabled tools are
        hidden from the model and error on execution. The state is persisted
        to `.axonerai/settings.jsonc` and survives server restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolToggle"
      responses:
        "200":
          description: Toggle applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required: [ok]
        "400":
          description: The tool name is not in the registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: false
                  error:
                    type: string
                    const: unknown tool
                required: [ok, error]

  /api/mcp:
    post:
      summary: Enable or disable an MCP server's tools
      description: >
        The panel-level MCP toggle (item48): applies per-tool suppression to
        every registered MCP tool of that server, so a disabled server's
        tools are hidden from the model for this session. By DEFAULT the
        toggle is NOT persisted server-side — the browser is the durable
        store (per-folder localStorage) and re-applies the stored disabled
        servers on boot; a server restart re-exposes all MCP tools until the
        browser reconnects. item54 opt-in: when the settings file sets
        `"mcp_toggle_persist": true`, the toggle ALSO persists the server to
        `disabled_mcp_servers` in `.axonerai/settings.jsonc` (a re-enable
        removes it) so a restart honours it without a browser re-apply.
        Unknown server (one with no registered facade tools) → 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpToggle"
      responses:
        "200":
          description: Toggle applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required: [ok]
        "400":
          description: The server has no registered MCP tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: false
                  error:
                    type: string
                    const: unknown mcp server
                required: [ok, error]

  /api/model:
    post:
      summary: Swap the agent service and/or model
      description: >
        item57: `{"service": "<name>", "model": "<id>"}` hot-swaps BOTH the
        service and the model for SUBSEQUENT agent runs — the provider is
        rebuilt from the service (mistral/groq dedicated providers;
        opencode-zen/opencode-go → OpenCodeProvider with the service's base
        URL) and the agent rebuilt with it (same tool registry, same
        per-session FileSessionManager, freshly composed system prompt)
        behind the shared runtime lock. The swap is not persisted — a
        restart returns to the configured/default service+model. Back-compat:
        `{"model": "<id>"}` alone swaps within the CURRENT service.
        Validation → 400: unknown service; service disabled in settings
        (`disabled_services`); service with no API key; model not in the
        TARGET service's roster (jsonc config roster OR the service's
        per-provider models config, item41). Responds with the updated
        state snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelSwap"
      responses:
        "200":
          description: Service/model swapped; updated snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateSnapshot"
        "400":
          description: >
            Unknown service, disabled service, service with no API key, or
            model unknown to the target service's roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: false
                  error:
                    type: string
                required: [ok, error]

  /api/sessions:
    get:
      summary: Session index
      description: All rollout sessions, newest first.
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"

  /api/session/reset:
    post:
      summary: Start a fresh session
      description: >
        item54 (eval support): mints a new uuid v7 session and rollout
        (a session_meta line is written as its first event), rebuilds the
        agent against the new per-session agent-state dir, and swaps both
        into the shared session lock — all WITHOUT a server restart.
        Service/model and the tool registry (suppression state included)
        are untouched. Responds with the updated state snapshot; repeat
        eval runs call this between runs instead of restarting the server.
        The reset itself is not persisted — a restart follows the ordinary
        `--continue`/`--session`/boot semantics.
      responses:
        "200":
          description: Fresh session started; updated snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateSnapshot"
        "500":
          description: The fresh rollout could not be created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: false
                  error:
                    type: string
                required: [ok, error]

  /api/session/{uuid}:
    get:
      summary: Rollout catch-up stream
      description: >
        Chunked line-format stream (`application/x-rollout-line`) of rollout
        events after `after` (epoch millis). Frames are
        `<ts>\0<type>\0<payload>\n`; oversized payloads are cut
        char-boundary-safe and detected by a failed strict JSON parse on the
        client. `tool_trace` records are never streamed. The scan halts
        cleanly at the first corrupt line.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: Lowercase UUID v7 session id
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            description: Only stream events with ts strictly greater than this
      responses:
        "200":
          description: Line-format stream
          content:
            application/x-rollout-line:
              schema:
                type: string
        "400":
          description: Invalid session id
        "404":
          description: Session not found

  /api/session/{uuid}/tail:
    get:
      summary: Rollout frontier timestamp
      description: Last event timestamp of the rollout, for frontier checks.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Frontier timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  _ts:
                    type: integer
                    format: int64
                required: [_ts]
        "400":
          description: Invalid session id
        "404":
          description: Session not found

components:
  schemas:
    StateSnapshot:
      type: object
      properties:
        service:
          type: string
          description: >
            Active service short name (item57; e.g. "mistral",
            "opencode-zen"). Renamed from `provider` — the old field is
            removed, not aliased.
        model:
          type: string
          description: Active model id (e.g. "zai-glm-5-2")
        session:
          type: object
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
          required: [id, title]
        repo:
          type: object
          properties:
            path:
              type: string
              description: Absolute cwd of the server process
            branch:
              type: [string, "null"]
              description: >
                Current git branch parsed from .git/HEAD (no subprocess);
                short sha on detached HEAD; null when not a repo
          required: [path, branch]
        context:
          type: object
          properties:
            tokens:
              type: integer
              description: >-
                Model context estimate: bytes/4 (floor) over the JSON
                serialization of the session's provider messages (system
                prompt included when loaded), read from the per-session
                agent-state file (`agent-state/<uuid>/messages.json`);
                0 when that file is missing or unreadable
            context_window:
              type: integer
              description: >-
                Current model's context window in tokens from the
                per-provider models config (item41,
                `.axonerai/models/<provider>-models.jsonc`, local masks
                user). Omitted when the config does not know the model —
                the browser's hardcoded window map stays as the fallback.
          required: [tokens]
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolInfo"
        mcp:
          type: array
          items:
            $ref: "#/components/schemas/McpServer"
        lsp:
          type: array
          items: {}
          description: Placeholder — always empty
        todo:
          description: Placeholder — always null
      required:
        - service
        - model
        - session
        - repo
        - context
        - tools
        - mcp
        - lsp
        - todo

    ToolInfo:
      type: object
      properties:
        name:
          type: string
          description: Tool name (e.g. "WebSearch", "tavily_search")
        enabled:
          type: boolean
          description: false when the tool is suppressed
        source:
          type: string
          enum: [builtin, mcp]
      required: [name, enabled, source]

    McpServer:
      type: object
      properties:
        name:
          type: string
          description: Server name (e.g. "tavily")
        status:
          type: string
          enum: [connected]
        enabled:
          type: boolean
          description: >-
            Whether the server's tools are currently exposed to the model
            (false when POST /api/mcp has suppressed them for this session)
      required: [name, status, enabled]

    ToolToggle:
      type: object
      properties:
        name:
          type: string
          description: Registered tool name
        enabled:
          type: boolean
          description: true to enable, false to disable (suppress)
      required: [name, enabled]

    McpToggle:
      type: object
      properties:
        server:
          type: string
          description: Registered MCP server name (e.g. "tavily")
        enabled:
          type: boolean
          description: true to expose the server's tools, false to suppress them
      required: [server, enabled]

    ModelSwap:
      type: object
      properties:
        service:
          type: string
          description: >
            Target service short name (item57). Omit to swap within the
            CURRENT service (back-compat). Must be a known service that is
            enabled in settings and has its API key present.
        model:
          type: string
          description: >
            Model id from the TARGET service's config roster or models
            config
      required: [model]

    ServiceEntry:
      type: object
      description: One known service's registry entry (item57)
      properties:
        service:
          type: string
          description: Service short name ("mistral", "groq", "opencode-zen", "opencode-go")
        enabled:
          type: boolean
          description: false when named in the settings `disabled_services` list
        connected:
          type: boolean
          description: >
            API key resolvable (per-service env var, with the shared
            OPENCODE_API_KEY fallback for opencode-zen/opencode-go)
        models:
          type: array
          description: The service's models-config roster; empty when no config file
          items:
            $ref: "#/components/schemas/ModelEntry"
      required: [service, enabled, connected, models]

    ModelEntry:
      type: object
      description: One model roster row (item41 JTD schema provider_models.jdt.json)
      properties:
        id:
          type: string
        display:
          type: string
        context_window:
          type: integer
          minimum: 0
        costs:
          type: [object, "null"]
          properties:
            input_per_mtok:
              type: string
            output_per_mtok:
              type: string
          additionalProperties: false
        offer:
          type: string
          description: Freeform offer text (e.g. "2x usage")
      required: [id, display, context_window]

    ModelsConfig:
      type: object
      description: One provider's models config (item41 JTD schema provider_models.jdt.json)
      properties:
        provider:
          type: string
        source:
          type: [string, "null"]
          enum: [local, user, null]
          description: Which file won (local masks user); null when no config exists
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelEntry"
      required: [provider, source, models]

    SkillEntry:
      type: object
      properties:
        name:
          type: string
          description: Skill name (the folder name, e.g. "lint")
        description:
          type: string
          description: Frontmatter description of the skill
        source:
          type: string
          enum: [local, user, builtin]
          description: >
            Where the entry was found: "local" (.axonerai/skills, wins) or
            "user" (~/.axonerai/skills). "builtin" is reserved for item50's
            in-code skills — not produced yet.
        path:
          type: string
          description: The SKILL.md file backing this entry
      required: [name, description, source, path]

    SessionInfo:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        title:
          type: string
        updated:
          type: integer
          format: int64
          description: Last-update epoch millis
        size:
          type: integer
          format: int64
          description: Rollout file size in bytes
      required: [uuid, title, updated, size]
