[package]
name = "axonerai"
version = "0.1.1"
edition = "2021"
authors = ["Manoj <mnjkshrm@gmail.com>"]
description = "A type-safe, blazing fast agentic AI framework in Rust"
license = "MIT"
repository = "https://github.com/Manojython/axonerai"
readme = "README.md"
keywords = ["ai", "agents", "llm", "rust", "framework"]
categories = ["development-tools", "api-bindings"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
scraper = "0.24.0"
uuid = { version = "1.18.1", features = ["v4"] }
clap = { version = "4.5.54", features = ["derive"] }
axum = { version = "0.8.8", features = ["ws"] }
tower-http = { version = "0.6.8", features = ["fs", "trace", "cors"] }
tokio-stream = "0.1.18"
futures = "0.3.31"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"


[dev-dependencies]
tokio-test = "0.4"
