[package]
name = "axonerai"
version = "0.1.1"
edition = "2024"
authors = ["Manoj <mnjkshrm@gmail.com>"]
description = "A type-safe, blazing fast agentic AI framework in Rust"
license = "MIT"
repository = "https://github.com/Manojython/axonerai"
readme = "README.md"
keywords = ["ai", "agents", "llm", "rust", "framework"]
categories = ["development-tools", "api-bindings"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
jtd = "0.3.1"
lineformat = { path = "wasm/lineformat" }
env = "1.0.1"
scraper = "0.24.0"
uuid = { version = "1.18.1", features = ["v4", "v7"] }
clap = { version = "4.5.27", features = ["derive"] }
axum = { version = "0.7.9", features = ["ws"], optional = true }
tower-http = { version = "0.5.2", features = ["fs"], optional = true }
futures-util = { version = "0.3.31", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }

[features]
web = ["axum", "tower-http", "futures-util", "tracing", "tracing-subscriber", "chrono"]

[dev-dependencies]
tokio-test = "0.4"

[[example]]
name = "axoner-web"
required-features = ["web"]

[[example]]
name = "axonerai-models"
