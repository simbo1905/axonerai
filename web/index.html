<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agt serve</title>

    <style>
      body {
        margin: 0;
        background: #0b1220;
        color: #e5e7eb;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 6px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }

      agt-app {
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-sizing: border-box;
        height: 100vh;
        max-width: 860px;
        margin: 0 auto;
        padding: 16px;
      }

      agt-status { display: block; }
      .pill {
        display: inline-block;
        padding: 3px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.03em;
      }
      .pill-connected { background: #052e23; color: #6ee7b7; border: 1px solid #10b981; }
      .pill-connecting { background: #0c1f3a; color: #93c5fd; border: 1px solid #3b82f6; }
      .pill-disconnected { background: #1f2937; color: #9ca3af; border: 1px solid #4b5563; }
      .pill-error { background: #3b0d0d; color: #fca5a5; border: 1px solid #ef4444; }

      agt-chat-log {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 10px;
      }

      agt-msg {
        display: block;
        padding: 10px 12px;
        border-radius: 10px;
        background: #111827;
        border: 1px solid #1f2937;
      }
      .msg-you { align-self: flex-end; max-width: 80%; background: #0c2a4d; border-color: #1d4ed8; }
      .msg-agent { align-self: flex-start; max-width: 80%; background: #111827; border-color: #334155; }
      .msg-error { background: #2a1215; border-color: #b91c1c; color: #fecaca; }
      .msg-system {
        align-self: center;
        background: transparent;
        border: 1px dashed #334155;
        color: #94a3b8;
        font-size: 13px;
      }
      .msg-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        opacity: 0.85;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .msg-role { font-weight: 600; }
      .msg-text {
        margin-top: 4px;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.5;
      }

      agt-composer { display: flex; gap: 8px; align-items: flex-end; }
      .composer-input {
        flex: 1;
        resize: vertical;
        min-height: 44px;
        background: #0f172a;
        color: #e5e7eb;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px;
        font: inherit;
      }
      .composer-input:focus { outline: 1px solid #3b82f6; border-color: #3b82f6; }
      .composer-input:disabled { opacity: 0.5; }
      .composer-send {
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        font: inherit;
        cursor: pointer;
      }
      .composer-send:hover:not(:disabled) { background: #1d4ed8; }
      .composer-send:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>

  <body>
    <agt-app></agt-app>
    <!-- Vanilla ESM2020 client that exposes window.AgtClient -->
    <script type="module" src="/assets/client.mjs"></script>
    <!-- Side-effect module defining the <agt-app> custom element (waits for window.AgtClient) -->
    <script type="module" src="/src/components/agt-app.js"></script>
  </body>
</html>
